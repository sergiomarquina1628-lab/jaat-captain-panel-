<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaat Captain Panel</title><link rel="icon" href="/assets/logo.svg"><style>
:root{--bg:#070a12;--card:#101525;--line:#27304a;--muted:#8994b2;--accent:#7b6cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0,#1d2c5b 0,transparent 30%),radial-gradient(circle at 95% 100%,#401a48 0,transparent 32%),var(--bg);color:#f4f6ff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{width:min(980px,94vw);margin:auto;padding:22px 0 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px}.brand h1{font-size:20px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:3px 0}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#11172a;color:#dbe1f7;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;text-decoration:none;font-size:12px}.hero{background:linear-gradient(145deg,#141b31,#0e1322);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 25px 70px #0005}.status{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#39e58c;box-shadow:0 0 12px #39e58c;margin-right:7px}.dot.off{background:#ff6075;box-shadow:0 0 12px #ff6075}.period{margin-top:20px;color:var(--muted);font-size:12px}.period strong{display:block;color:#fff;font-size:28px;margin-top:5px;letter-spacing:1px}.resultbox{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.result{min-height:190px;border:1px solid var(--line);border-radius:18px;background:#0b1020;display:grid;place-items:center;text-align:center}.number{font-size:78px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#aeb9ff);-webkit-background-clip:text;background-clip:text;color:transparent}.label{color:var(--muted);font-size:12px}.bigsmall{font-size:25px;font-weight:900;margin-top:9px}.count{font-variant-numeric:tabular-nums;font-size:24px;font-weight:900}.bar{height:6px;background:#1d2540;border-radius:99px;margin-top:12px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#6d7dff,#a34dff);transform-origin:left}.section{margin-top:18px;background:rgba(13,18,32,.82);border:1px solid var(--line);border-radius:18px;padding:18px}.section h2{font-size:14px;margin:0 0 13px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:#68738f;font-weight:700;padding:9px;border-bottom:1px solid var(--line)}.table td{padding:10px 9px;border-bottom:1px solid #1c2338}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;background:#171e35;color:#c9d0e8}.footer{text-align:center;color:#56617d;font-size:11px;margin-top:18px}.err{color:#ff879a;text-align:center;padding:12px}.empty{color:var(--muted);padding:18px;text-align:center}@media(max-width:650px){.wrap{padding-top:14px}.top{align-items:flex-start}.actions{flex-direction:column}.resultbox{grid-template-columns:1fr}.result{min-height:160px}.number{font-size:68px}.period strong{font-size:22px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><img src="/assets/logo.svg"><div><h1>Jaat Captain Panel</h1><p>WIN GO 1M • ONE PERIOD DELAY</p></div></div><div class="actions"><a class="btn" href="https://t.me/" target="_blank" rel="noreferrer">TELEGRAM</a><button class="btn" onclick="location.href='/'">LOGOUT</button></div></header>
<section class="hero"><div class="status"><span><i id="dot" class="dot"></i><span id="status">LIVE</span></span><span id="updated">Updating…</span></div><div class="period">CURRENT DISPLAY PERIOD<strong id="period">—</strong></div><div class="resultbox"><div class="result"><div><div class="label">RESULT</div><div class="number" id="number">—</div><div class="bigsmall" id="bs">—</div></div></div><div class="result"><div><div class="label">NEXT 1-MINUTE CYCLE</div><div class="count" id="count">60s</div><div class="bar"><div class="fill" id="fill"></div></div><div class="label" style="margin-top:10px">Auto refresh</div></div></div></div></section>
<section class="section"><h2>RECENT RESULTS</h2><div id="history"><div class="empty">Loading live history…</div></div></section><div class="footer">Jaat Captain Panel • live WinGo 1M feed • delayed by one settled period</div></main>
<script>
const $=id=>document.getElementById(id);let lastPeriod='';let tick=0;let timer=null;
function cls(n){return Number(n)>=5?'BIG':'SMALL'}
function render(j){if(!j.live)throw new Error(j.error||'Feed unavailable');const x=j.latest;if(!x)throw new Error('No result returned');$('period').textContent=x.period;$('number').textContent=x.result;$('bs').textContent=cls(x.result);$('updated').textContent='Updated '+new Date().toLocaleTimeString();$('dot').className='dot';$('status').textContent='LIVE';const rows=(j.history||[]).map(r=>`<tr><td>${r.period}</td><td><span class="pill">${r.result}</span></td><td>${cls(r.result)}</td></tr>`).join('');$('history').innerHTML=rows?`<table class="table"><thead><tr><th>PERIOD</th><th>NUMBER</th><th>TYPE</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">No history available.</div>';if(x.period!==lastPeriod){lastPeriod=x.period;tick=60}}
async function load(){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.status===401||r.redirected){location.href='/';return}const j=await r.json();if(!r.ok)throw new Error(j.error||'Feed unavailable');render(j)}catch(e){$('status').textContent='OFFLINE';$('dot').className='dot off';$('updated').textContent=e.message}}
function clock(){tick=Math.max(0,tick-1);$('count').textContent=tick+'s';$('fill').style.transform=`scaleX(${tick/60})`;if(tick===0){load();tick=60}}
load();timer=setInterval(clock,1000);setInterval(load,15000);
</script></body></html>
