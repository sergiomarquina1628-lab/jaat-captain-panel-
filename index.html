<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jaat Captain Panel</title>
<link rel="icon" href="/assets/logo.svg">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#070a12;color:#eef2ff;display:grid;place-items:center;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#253b75 0,transparent 34%),radial-gradient(circle at 90% 90%,#4b174f 0,transparent 32%),linear-gradient(135deg,#070a12,#0c1020 55%,#080912)}
.card{position:relative;width:min(430px,92vw);padding:30px;border:1px solid #29324c;background:rgba(13,17,31,.82);backdrop-filter:blur(18px);border-radius:24px;box-shadow:0 30px 90px #0008}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:24px}.brand img{width:52px;height:52px}.brand h1{font-size:23px;margin:0}.brand p{margin:3px 0 0;color:#8994b2;font-size:13px}
label{display:block;color:#aeb8d3;font-size:13px;margin:0 0 8px}.input{width:100%;height:52px;border-radius:14px;border:1px solid #303a56;background:#0a0e1b;color:#fff;padding:0 15px;font-size:15px;outline:none}.input:focus{border-color:#6d7dff;box-shadow:0 0 0 3px #6d7dff22}
button{width:100%;height:52px;margin-top:13px;border:0;border-radius:14px;background:linear-gradient(135deg,#6d7dff,#8d4dff);color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 12px 28px #6d5cff33}.msg{min-height:22px;margin-top:12px;text-align:center;color:#ff879a;font-size:13px}.hint{margin-top:18px;text-align:center;color:#66708d;font-size:11px}
</style></head>
<body><div class="bg"></div><main class="card">
<div class="brand"><img src="/assets/logo.svg"><div><h1>Jaat Captain Panel</h1><p>WinGo 1 Minute • Live Panel</p></div></div>
<form id="login"><label for="key">Access Key</label><input class="input" id="key" autocomplete="off" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" required><button>ENTER PANEL</button><div class="msg" id="msg"></div></form>
<div class="hint">Secure session • Live data refreshes automatically</div>
</main>
<script>const f=document.getElementById('login'),m=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Verifying…';try{const r=await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:document.getElementById('key').value.trim()})});const j=await r.json();if(!r.ok||!j.valid)throw new Error(j.error||'Invalid access key');location.href='/panel/'}catch(x){m.textContent=x.message}});</script>
</body></html>
